<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video Gallery - శ్రీ కట్లమ్మ ఆలయం</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Telugu:wght@400;600;700&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet" />
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/animations.css" />
    <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>

    <!-- Navbar -->
    <nav id="mainNav" class="navbar navbar-expand-lg fixed-top navbar-dark">
        <!-- Same navbar -->
    </nav>

    <!-- Page Header -->
    <section class="page-header py-5 mt-5">
        <div class="container">
            <h1 class="display-4 fw-bold" data-aos="fade-up">Video Gallery</h1>
            <p class="lead" data-aos="fade-up" data-aos-delay="100">శ్రీ శ్రీ కట్లమ్మ అమ్మవారి ఆలయ ఉత్సవాల వీడియోలు</p>
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="index.html">Home</a></li>
                    <li class="breadcrumb-item active" aria-current="page">Videos</li>
                </ol>
            </nav>
        </div>
    </section>

    <!-- Video Filters -->
    <section class="py-4">
        <div class="container">
            <div class="row g-3">
                <div class="col-md-4">
                    <select id="videoYearFilter" class="form-select">
                        <option value="all">All Years</option>
                        <option value="2026">2026</option>
                        <option value="2025">2025</option>
                        <option value="2024">2024</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <select id="videoEventFilter" class="form-select">
                        <option value="all">All Events</option>
                        <option value="kavadi">Kavadi Festival</option>
                        <option value="jathara">Jathara</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <input type="text" id="videoSearch" class="form-control" placeholder="Search videos..." />
                </div>
            </div>
        </div>
    </section>

    <!-- Video Grid -->
    <section class="py-4">
        <div class="container">
            <div class="row g-4" id="videoContainer">
                <!-- Videos loaded dynamically -->
                <div class="col-12 text-center py-5" id="loadingVideos">
                    <div class="spinner-border text-gold" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <p class="mt-3">Loading videos...</p>
                </div>
            </div>
        </div>
    </section>

    <!-- Video Modal -->
    <div class="modal fade" id="videoModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content bg-dark">
                <div class="modal-header border-0">
                    <h5 class="modal-title text-white" id="videoModalTitle">Video Title</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="videoPlayerContainer">
                        <iframe id="videoPlayer" width="100%" height="400" src="" frameborder="0" allowfullscreen></iframe>
                    </div>
                    <div class="video-info text-white mt-3">
                        <p id="videoModalDescription"></p>
                        <small id="videoModalDate"></small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer pt-5 pb-3">
        <!-- Same footer -->
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="js/main.js"></script>
    <script src="js/videos.js"></script>
</body>
</html>
