<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login - శ్రీ కట్లమ్మ ఆలయం</title>
    
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Telugu:wght@400;600;700&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet" />
    
    <style>
        :root {
            --primary-maroon: #7a1a2e;
            --primary-dark: #4a0e1a;
            --gold: #c9a04e;
            --gold-light: #e8d5a3;
            --cream: #f9f1e7;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, var(--primary-dark), var(--primary-maroon));
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .login-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 3rem 2.5rem;
            max-width: 440px;
            width: 100%;
            border: 1px solid rgba(201, 160, 78, 0.2);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
        }
        
        .login-logo {
            text-align: center;
            margin-bottom: 2.5rem;
        }
        
        .login-logo .temple-icon {
            font-size: 3.5rem;
            color: var(--gold);
            display: block;
            margin-bottom: 0.5rem;
        }
        
        .login-logo h2 {
            font-family: 'Noto Serif Telugu', serif;
            color: var(--gold);
            font-size: 1.5rem;
            margin-bottom: 0.25rem;
        }
        
        .login-logo p {
            color: var(--gold-light);
            font-size: 0.9rem;
            opacity: 0.8;
        }
        
        .form-floating {
            margin-bottom: 1.25rem;
        }
        
        .form-floating input {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(201, 160, 78, 0.2);
            color: #fff;
            border-radius: 12px;
            padding: 1rem 1rem 0.5rem 1rem;
            height: 60px;
            transition: all 0.3s ease;
        }
        
        .form-floating input:focus {
            background: rgba(255, 255, 255, 0.12);
            border-color: var(--gold);
            box-shadow: 0 0 0 0.25rem rgba(201, 160, 78, 0.15);
            color: #fff;
        }
        
        .form-floating label {
            color: rgba(255, 255, 255, 0.6);
            font-weight: 400;
        }
        
        .form-floating input:focus ~ label {
            color: var(--gold);
        }
        
        .btn-login {
            background: linear-gradient(135deg, var(--gold), #a8853a);
            border: none;
            color: #fff;
            padding: 0.8rem;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            width: 100%;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(201, 160, 78, 0.3);
            color: #fff;
        }
        
        .btn-login:active {
            transform: translateY(0);
        }
        
        .btn-login i {
            margin-right: 8px;
        }
        
        .alert {
            border-radius: 12px;
            background: rgba(220, 53, 69, 0.15);
            border: 1px solid rgba(220, 53, 69, 0.3);
            color: #ff6b6b;
            padding: 0.75rem 1rem;
            display: none;
        }
        
        .alert.show {
            display: block;
        }
        
        .login-footer {
            text-align: center;
            margin-top: 1.5rem;
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.8rem;
        }
        
        .login-footer a {
            color: var(--gold);
            text-decoration: none;
        }
        
        .login-footer a:hover {
            text-decoration: underline;
        }
        
        /* Decorative elements */
        .login-decoration {
            position: fixed;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(201, 160, 78, 0.05), transparent 70%);
            pointer-events: none;
        }
        
        .decoration-1 {
            top: -100px;
            right: -100px;
        }
        
        .decoration-2 {
            bottom: -100px;
            left: -100px;
        }
        
        /* Responsive */
        @media (max-width: 576px) {
            .login-container {
                padding: 2rem 1.5rem;
            }
            
            .login-logo h2 {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>

    <!-- Decorative Elements -->
    <div class="login-decoration decoration-1"></div>
    <div class="login-decoration decoration-2"></div>

    <div class="login-container">
        <div class="login-logo">
            <span class="temple-icon"><i class="bi bi-building"></i></span>
            <h2>శ్రీ శ్రీ కట్లమ్మ</h2>
            <p>అమ్మవారి ఆలయం · Admin Panel</p>
        </div>

        <form id="loginForm" onsubmit="return handleLogin(event)">
            <div class="form-floating">
                <input type="text" class="form-control" id="username" placeholder="Username" required />
                <label for="username"><i class="bi bi-person"></i> Username</label>
            </div>
            
            <div class="form-floating">
                <input type="password" class="form-control" id="password" placeholder="Password" required />
                <label for="password"><i class="bi bi-lock"></i> Password</label>
            </div>
            
            <div id="loginAlert" class="alert">
                <i class="bi bi-exclamation-circle"></i>
                <span id="alertMessage">Invalid username or password</span>
            </div>
            
            <button type="submit" class="btn-login">
                <i class="bi bi-box-arrow-in-right"></i> Sign In
            </button>
        </form>
        
        <div class="login-footer">
            <p>Secure Admin Access · <a href="../index.html">Return to Website</a></p>
        </div>
    </div>

    <script>
        // ===== ADMIN LOGIN HANDLER =====
        const ADMIN_CREDENTIALS = {
            username: 'admin',
            password: 'temple@2026'
        };

        function handleLogin(event) {
            event.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const alertEl = document.getElementById('loginAlert');
            const alertMessage = document.getElementById('alertMessage');
            
            // Hide any previous alert
            alertEl.classList.remove('show');
            
            // Validate
            if (!username || !password) {
                alertMessage.textContent = 'Please enter both username and password';
                alertEl.classList.add('show');
                return false;
            }
            
            // Check credentials
            if (username === ADMIN_CREDENTIALS.username && password === ADMIN_CREDENTIALS.password) {
                // Login successful
                sessionStorage.setItem('adminLoggedIn', 'true');
                sessionStorage.setItem('adminUser', username);
                sessionStorage.setItem('adminLoginTime', new Date().toISOString());
                
                // Redirect to dashboard
                window.location.href = 'dashboard.html';
                return true;
            } else {
                // Login failed
                alertMessage.textContent = 'Invalid username or password. Please try again.';
                alertEl.classList.add('show');
                
                // Clear password field
                document.getElementById('password').value = '';
                document.getElementById('password').focus();
                return false;
            }
        }

        // Check if already logged in
        document.addEventListener('DOMContentLoaded', function() {
            if (sessionStorage.getItem('adminLoggedIn') === 'true') {
                window.location.href = 'dashboard.html';
            }
        });

        // Enter key support
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const form = document.getElementById('loginForm');
                if (form && document.activeElement) {
                    const inputs = form.querySelectorAll('input');
                    for (let input of inputs) {
                        if (input === document.activeElement) {
                            form.dispatchEvent(new Event('submit'));
                            break;
                        }
                    }
                }
            }
        });
    </script>

</body>
</html>
