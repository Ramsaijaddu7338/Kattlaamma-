<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photo Gallery - శ్రీ కట్లమ్మ ఆలయం</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Telugu:wght@400;600;700&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet" />
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/animations.css" />
    <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>

    <!-- Navbar -->
    <nav id="mainNav" class="navbar navbar-expand-lg fixed-top navbar-dark">
        <!-- Same navbar -->
    </nav>

    <!-- Page Header -->
    <section class="page-header py-5 mt-5">
        <div class="container">
            <h1 class="display-4 fw-bold" data-aos="fade-up">Photo Gallery</h1>
            <p class="lead" data-aos="fade-up" data-aos-delay="100">శ్రీ శ్రీ కట్లమ్మ అమ్మవారి ఆలయ ఉత్సవాల ఫోటోలు</p>
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="index.html">Home</a></li>
                    <li class="breadcrumb-item active" aria-current="page">Gallery</li>
                </ol>
            </nav>
        </div>
    </section>

    <!-- Gallery Filters -->
    <section class="py-4">
        <div class="container">
            <div class="row g-3">
                <div class="col-md-3">
                    <select id="galleryYearFilter" class="form-select">
                        <option value="all">All Years</option>
                        <option value="2026">2026</option>
                        <option value="2025">2025</option>
                        <option value="2024">2024</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <select id="galleryEventFilter" class="form-select">
                        <option value="all">All Events</option>
                        <option value="kavadi">Kavadi Festival</option>
                        <option value="jathara">Jathara</option>
                        <option value="annual">Annual Festival</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <div class="input-group">
                        <input type="text" id="gallerySearch" class="form-control" placeholder="Search photos..." />
                        <button class="btn btn-gold" id="searchBtn">
                            <i class="bi bi-search"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Masonry Gallery -->
    <section class="py-4">
        <div class="container">
            <div class="row g-4" id="galleryContainer">
                <!-- Images loaded dynamically with masonry layout -->
                <div class="col-12 text-center py-5" id="loadingGallery">
                    <div class="spinner-border text-gold" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <p class="mt-3">Loading gallery...</p>
                </div>
            </div>
            
            <!-- Load More Button -->
            <div class="text-center mt-4">
                <button class="btn btn-outline-gold" id="loadMoreGallery">Load More</button>
            </div>
        </div>
    </section>

    <!-- Lightbox Modal -->
    <div class="modal fade" id="lightboxModal" tabindex="-1">
        <div class="modal-dialog modal-fullscreen">
            <div class="modal-content bg-dark">
                <div class="modal-header border-0">
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body d-flex align-items-center justify-content-center">
                    <div id="lightboxContent" class="text-center">
                        <img id="lightboxImage" src="" alt="Gallery Image" class="img-fluid" style="max-height: 80vh;" />
                        <div class="lightbox-caption text-white mt-3">
                            <h5 id="lightboxTitle"></h5>
                            <p id="lightboxDescription"></p>
                            <span id="lightboxCounter" class="badge bg-gold"></span>
                        </div>
                        <div class="lightbox-nav">
                            <button class="btn btn-light btn-sm" id="prevImage"><i class="bi bi-chevron-left"></i></button>
                            <button class="btn btn-light btn-sm" id="nextImage"><i class="bi bi-chevron-right"></i></button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer pt-5 pb-3">
        <!-- Same footer -->
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="js/main.js"></script>
    <script src="js/gallery.js"></script>
</body>
</html>
