<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Events - శ్రీ కట్లమ్మ ఆలయం</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Telugu:wght@400;600;700&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet" />
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/animations.css" />
    <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>

    <!-- Navbar -->
    <nav id="mainNav" class="navbar navbar-expand-lg fixed-top navbar-dark">
        <!-- Same navbar code -->
    </nav>

    <!-- Page Header -->
    <section class="page-header py-5 mt-5">
        <div class="container">
            <h1 class="display-4 fw-bold" data-aos="fade-up">వార్షిక ఉత్సవాలు</h1>
            <p class="lead" data-aos="fade-up" data-aos-delay="100">శ్రీ శ్రీ కట్లమ్మ అమ్మవారి ఆలయ ఉత్సవాల డిజిటల్ ఆర్కైవ్</p>
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="index.html">Home</a></li>
                    <li class="breadcrumb-item active" aria-current="page">Events</li>
                </ol>
            </nav>
        </div>
    </section>

    <!-- Events Filter -->
    <section class="py-4">
        <div class="container">
            <div class="row g-3 align-items-center">
                <div class="col-md-6">
                    <div class="event-filters">
                        <label class="fw-bold me-2">Filter by Year:</label>
                        <select id="yearFilter" class="form-select d-inline-block w-auto">
                            <option value="all">All Years</option>
                            <option value="2026">2026</option>
                            <option value="2025">2025</option>
                            <option value="2024">2024</option>
                            <option value="2023">2023</option>
                        </select>
                    </div>
                </div>
                <div class="col-md-6 text-md-end">
                    <span class="badge bg-gold me-2" id="eventCount">0 Events</span>
                    <button class="btn btn-outline-gold btn-sm" id="refreshEvents">
                        <i class="bi bi-arrow-clockwise"></i> Refresh
                    </button>
                </div>
            </div>
        </div>
    </section>

    <!-- Events Grid -->
    <section class="py-4">
        <div class="container">
            <div class="row g-4" id="allEventsContainer">
                <!-- Events loaded dynamically -->
                <div class="col-12 text-center py-5" id="loadingEvents">
                    <div class="spinner-border text-gold" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <p class="mt-3">Loading events...</p>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer pt-5 pb-3">
        <!-- Same footer -->
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="js/main.js"></script>
    <script src="js/events.js"></script>
</body>
</html>
